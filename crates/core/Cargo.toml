[package]
name = "bhb-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
btleplug = "0.11"
futures-util = "0.3"
jpeg-encoder = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_FaceAnalysis",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
]
