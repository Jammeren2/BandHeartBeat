[package]
name = "band-heart-beat"
version = "0.1.0"
edition = "2021"

[dependencies]
btleplug = "0.11"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
anyhow = "1"
uuid = { version = "1", features = ["macro-diagnostics"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
