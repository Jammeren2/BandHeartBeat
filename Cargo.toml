[workspace]
resolver = "2"
members = ["crates/core", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Pixel loops are too slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.bhb-core]
opt-level = 2
